
<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Channel Mongolia</title>
    <meta name="description" content="A modern digital knowledge & media platform sharing interesting knowledge, science, and facts in Mongolian and English." />
    
    <!-- Theme Initialization (Anti-FOUC) -->
    <script>
      (function() {
        try {
          var localTheme = localStorage.getItem('cm_theme');
          var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (localTheme === 'dark' || (!localTheme && supportDarkMode)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Roboto', 'sans-serif'],
            },
            colors: {
              // Using CSS variables for semantic coloring
              background: 'var(--bg-app)',
              surface: 'var(--bg-surface)',
              surfaceHighlight: 'var(--bg-surface-highlight)',
              border: 'var(--border-color)',
              text: {
                main: 'var(--text-main)',
                muted: 'var(--text-muted)',
              },
              // Brand Colors (kept as is)
              brand: {
                purple: '#6D28D9', // Deep Purple
                orange: '#F97316', // Warm Orange
                dark: '#020617',   // Deepest Charcoal/Navy
                surface: '#0F172A' // Card Surface
              },
              primary: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
              },
            },
            borderRadius: {
              'xl': '12px',
              '2xl': '16px',
              '3xl': '24px',
            },
            boxShadow: {
              'glow': '0 0 20px -5px rgba(109, 40, 217, 0.3)',
              'glow-orange': '0 0 20px -5px rgba(249, 115, 22, 0.3)',
              'soft': '0 10px 40px -10px rgba(0, 0, 0, 0.05)',
              'card': '0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03)',
              'card-hover': '0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04)',
            },
            animation: {
              'gradient-x': 'gradient-x 15s ease infinite',
            },
            keyframes: {
              'gradient-x': {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center'
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center'
                },
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Light Mode Tokens */
        --bg-app: #F8FAFC;
        --bg-surface: #FFFFFF;
        --bg-surface-highlight: #F1F5F9;
        --text-main: #0F172A;
        --text-muted: #64748B;
        --border-color: #E2E8F0;
      }
      
      /* FIX: Applied directly to html.dark instead of html.dark :root */
      html.dark {
        /* Dark Mode Tokens */
        --bg-app: #020617;
        --bg-surface: #0F172A; 
        --bg-surface-highlight: #1E293B;
        --text-main: #F8FAFC;
        --text-muted: #94A3B8;
        --border-color: rgba(255, 255, 255, 0.08);
      }

      body {
        background-color: var(--bg-app);
        color: var(--text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
      }

      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
      }
      
      html.dark .glass {
        background: rgba(2, 6, 23, 0.85);
      }
      
      .text-gradient {
        background: linear-gradient(135deg, #6D28D9 0%, #F97316 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
      }
      
      .bg-gradient-brand {
        background: linear-gradient(135deg, #6D28D9 0%, #F97316 100%);
      }
    </style>

}
</script>
</head>

  </body>
</html>
