<!DOCTYPE html>
<html lang="mn" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Channel Mongolia</title>
    <meta name="description" content="A modern digital knowledge & media platform sharing interesting knowledge, science, and facts in Mongolian and English." />
    
    <!-- Tailwind CSS (CDN for simplicity in this setup, ideally build step for prod) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Roboto', 'sans-serif'],
            },
            colors: {
              // Brand Colors
              brand: {
                purple: '#6D28D9', // Deep Purple
                orange: '#F97316', // Warm Orange
                dark: '#020617',   // Deepest Charcoal/Navy
                surface: '#0F172A' // Card Surface
              },
              primary: {
                50: '#f5f3ff',
                100: '#ede9fe',
                200: '#ddd6fe',
                300: '#c4b5fd',
                400: '#a78bfa',
                500: '#8b5cf6',
                600: '#7c3aed',
                700: '#6d28d9',
                800: '#5b21b6',
                900: '#4c1d95',
              },
              secondary: {
                500: '#06b6d4', // Muted Cyan
              }
            },
            borderRadius: {
              'xl': '12px',
              '2xl': '16px',
              '3xl': '24px',
            },
            boxShadow: {
              'glow': '0 0 20px -5px rgba(109, 40, 217, 0.3)', // Purple glow
              'glow-orange': '0 0 20px -5px rgba(249, 115, 22, 0.3)', // Orange glow
              'soft': '0 10px 40px -10px rgba(0, 0, 0, 0.2)',
            },
            animation: {
              'gradient-x': 'gradient-x 15s ease infinite',
            },
            keyframes: {
              'gradient-x': {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center'
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center'
                },
              },
            }
          }
        }
      }
    </script>
    <style>
      body {
        transition: background-color 0.3s ease, color 0.3s ease;
      }
      
      /* Dark Mode Defaults */
      html.dark body {
        background-color: #020617; /* Very dark purple-blue/charcoal */
        color: #F1F5F9;
      }
      
      /* Light Mode Defaults */
      html:not(.dark) body {
        background-color: #F8FAFC; /* Soft off-white */
        color: #0F172A;
      }

      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      /* Dynamic Glass Effect */
      .glass {
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        transition: all 0.3s ease;
      }
      
      html.dark .glass {
        background: rgba(2, 6, 23, 0.8);
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }
      
      html:not(.dark) .glass {
        background: rgba(255, 255, 255, 0.9);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }
      
      /* Premium Gradient Text Utility */
      .text-gradient {
        background: linear-gradient(135deg, #6D28D9 0%, #F97316 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
      }
      
      .bg-gradient-brand {
        background: linear-gradient(135deg, #6D28D9 0%, #F97316 100%);
      }

      .border-gradient-brand {
         border-image: linear-gradient(135deg, #6D28D9 0%, #F97316 100%);
         border-image-slice: 1;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.556.0",
    "react-router-dom": "https://aistudiocdn.com/react-router-dom@^7.10.1",
    "@vitejs/plugin-react": "https://aistudiocdn.com/@vitejs/plugin-react@^5.1.2",
    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1",
    "vite": "https://aistudiocdn.com/vite@^7.2.7",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.1/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.31.0",
    "@supabase/supabase-js": "https://esm.sh/@supabase/supabase-js@^2.87.1"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
