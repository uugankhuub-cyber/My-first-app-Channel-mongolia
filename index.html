
<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Channel Mongolia</title>
    <meta name="description" content="A modern digital knowledge & media platform sharing interesting knowledge, science, and facts in Mongolian and English." />
    
    <!-- Theme Initialization (Anti-FOUC) -->
    <script>
      (function() {
        try {
          var localTheme = localStorage.getItem('cm_theme');
          var supportDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (localTheme === 'dark' || (!localTheme && supportDarkMode)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Roboto', 'sans-serif'],
              serif: ['Georgia', 'serif'],
            },
            colors: {
              background: 'var(--bg-app)',
              surface: 'var(--bg-surface)',
              surfaceHighlight: 'var(--bg-surface-highlight)',
              border: 'var(--border-color)',
              text: {
                main: 'var(--text-main)',
                muted: 'var(--text-muted)',
              },
              brand: {
                purple: '#6366f1', 
                orange: '#f472b6', 
                dark: '#020617',   
                surface: '#0f172a' 
              },
            },
            borderRadius: {
              'xl': '12px',
              '2xl': '16px',
              '3xl': '24px',
            },
            boxShadow: {
              'glow': '0 0 20px -5px rgba(99, 102, 241, 0.3)',
              'glow-orange': '0 0 20px -5px rgba(244, 114, 182, 0.3)',
              'soft': '0 10px 40px -10px rgba(0, 0, 0, 0.05)',
              'card': '0 2px 8px -1px rgba(0, 0, 0, 0.04), 0 1px 4px -1px rgba(0, 0, 0, 0.02)',
              'card-hover': '0 12px 24px -4px rgba(0, 0, 0, 0.08), 0 4px 6px -2px rgba(0, 0, 0, 0.04)',
            },
            animation: {
              'gradient-x': 'gradient-x 15s ease infinite',
              'pulse-fast': 'pulse 1.5s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            },
            keyframes: {
              'gradient-x': {
                '0%, 100%': {
                  'background-size': '200% 200%',
                  'background-position': 'left center'
                },
                '50%': {
                  'background-size': '200% 200%',
                  'background-position': 'right center'
                },
              },
            }
          }
        }
      }
    </script>
    <style>
      :root {
        /* Light Mode Tokens - Softened Modern Editorial */
        --bg-app: #f6f8fa; /* Soft elegant off-white with hint of slate */
        --bg-surface: #ffffff; /* Pure white surface cards */
        --bg-surface-highlight: #edf1f7; /* Soft highlighted slate grey */
        --text-main: #0f172a; /* Slate-900 */
        --text-muted: #475569; /* Slate-600 */
        --border-color: #e2e8f0; /* Slate-200 */
      }
      
      html.dark {
        /* Dark Mode Tokens - Softened Modern Cosmic Slate */
        --bg-app: #0e111a; /* Softened dark midnight slate */
        --bg-surface: #141824; /* Soft elegant dark surface card */
        --bg-surface-highlight: #1d2132; /* Slightly lighter state */
        --text-main: #f1f5f9; /* Slate-100 */
        --text-muted: #94a3b8; /* Slate-400 */
        --border-color: #1e2439; /* Beautiful matching soft border */
      }

      body {
        background-color: var(--bg-app);
        color: var(--text-main);
        transition: background-color 0.3s ease, color 0.3s ease;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Global Focus Ring for Accessibility */
      *:focus-visible {
        outline: 2px solid #6D28D9;
        outline-offset: 2px;
      }

      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      .no-scrollbar {
          -ms-overflow-style: none;
          scrollbar-width: none;
      }
      
      .glass {
        background: rgba(255, 255, 255, 0.85);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border-color);
      }
      
      html.dark .glass {
        background: rgba(14, 18, 36, 0.85);
      }
      
      .text-gradient {
        background: linear-gradient(135deg, #6366f1 0%, #f472b6 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        color: transparent;
      }
      
      .bg-gradient-brand {
        background: linear-gradient(135deg, #6366f1 0%, #f472b6 100%);
      }

      /* Mobile Category Fade Mask */
      .mask-linear-fade {
        mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
        -webkit-mask-image: linear-gradient(to right, transparent, black 10%, black 90%, transparent);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
