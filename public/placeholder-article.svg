<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0e18" />
      <stop offset="50%" stop-color="#12182c" />
      <stop offset="100%" stop-color="#070913" />
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="glowTopRight" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0b0e18" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowBottomLeft" cx="20%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0b0e18" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.03" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowTopRight)" />
  <rect width="1200" height="630" fill="url(#glowBottomLeft)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Subtle Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="#2563eb" stroke-opacity="0.2" stroke-width="2" />

  <!-- Center Emblem Graphic -->
  <g transform="translate(600, 240)">
    <!-- Outer Glow Circle -->
    <circle r="88" fill="#1e293b" fill-opacity="0.6" stroke="url(#brandGrad)" stroke-width="3" />
    <circle r="72" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    
    <!-- Stylized Camera / Knowledge Hexagon Monogram -->
    <path d="M-32 -24 L0 -42 L32 -24 L32 24 L0 42 L-32 24 Z" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-linejoin="round" />
    <!-- Center Play/Lens Accent -->
    <polygon points="-10,-18 20,0 -10,18" fill="url(#brandGrad)" />
  </g>

  <!-- Typography -->
  <!-- Brand Name -->
  <text x="600" y="390" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="4">
    CHANNEL MONGOLIA
  </text>

  <!-- Subtitle in Mongolian and English -->
  <text x="600" y="440" text-anchor="middle" font-family="Inter, Roboto, system-ui, sans-serif" font-weight="600" font-size="20" fill="#94a3b8" letter-spacing="2">
    ЦАХИМ МЭДЭЭ, МЭДЛЭГИЙН НЭГДСЭН ПЛАТФОРМ
  </text>

  <!-- Bottom Accent Tag -->
  <g transform="translate(600, 520)">
    <rect x="-140" y="-18" width="280" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
    <circle cx="-100" cy="0" r="5" fill="#06b6d4" />
    <text x="-80" y="6" font-family="Inter, Roboto, system-ui, sans-serif" font-weight="700" font-size="13" fill="#cbd5e1" letter-spacing="1.5">
      KNOWLEDGE &amp; MEDIA
    </text>
  </g>
</svg>
